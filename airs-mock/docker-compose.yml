# AIRS mock as a standalone container, independent of the main HappyPet stack.
# Usage: docker compose -f airs-mock/docker-compose.yml up -d --build
# The API container reaches it through host.docker.internal:9100.
name: happypet-airs

services:
  airs-mock:
    build:
      context: .
    image: happypet-airs-mock:local
    container_name: happypet-airs-mock
    restart: unless-stopped
    environment:
      PORT: 9100
      AIRS_API_KEY: ${AIRS_API_KEY:-dev-airs-key}
    ports:
      - "${AIRS_MOCK_PORT:-9100}:9100"
    volumes:
      - airs-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  airs-data:
