services:
  postgres:
    image: postgres:16-alpine
    container_name: happypet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: HappyPetDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - happypet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HappyPetDb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  happypet-postgres-data:
